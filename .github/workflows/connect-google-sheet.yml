name: Connect Google Sheet

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Google Apps Script URL
        env:
          GOOGLE_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbziNzj7CWK1wsEk-B__sA712vBCyVztP4JWG7HAfSf5ZgSLz1nlUi6Q6h4LLWNXFZCy/exec"
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          url = os.environ["GOOGLE_SCRIPT_URL"]

          patterns = [
              r'(const\\s+GOOGLE_SCRIPT_URL\\s*=\\s*["\']).*?(["\'])',
              r'(GOOGLE_SCRIPT_URL\\s*[:=]\\s*["\']).*?(["\'])',
          ]

          new_text = text
          for pattern in patterns:
              new_text, count = re.subn(pattern, lambda m: m.group(1) + url + m.group(2), new_text, count=1)
              if count:
                  break

          if new_text == text:
              raise SystemExit("Could not find GOOGLE_SCRIPT_URL in index.html")

          path.write_text(new_text, encoding="utf-8")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change needed."
          else
            git commit -m "Connect order form to Google Sheets"
            git push
          fi
